name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs every 48 hours at 08:00 UTC (well within Supabase's 7-day inactivity pause window)
    - cron: '0 8 */2 * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qeinjomcfirfbtzesafo.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_3gB7NWi2Eu6ubbj44oNx0A_BxBZnUG-' }}
        run: |
          echo "Pinging Supabase PostgREST API directly to execute real PostgreSQL query..."
          
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/sessions?select=id&limit=1")
          
          echo "Supabase response status: $HTTP_CODE"
          echo "Response body: $(cat response.json)"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase database query executed successfully! Inactivity timer reset."
            exit 0
          else
            echo "❌ Supabase query failed with status $HTTP_CODE"
            exit 1
          fi
